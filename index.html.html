<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Flower</title>
    <style>
         html,body{
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background-color: #f2f7f5;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}
.bouquet{
    position: relative;
    width: 300px;
    height: 400px;
    display: flex;
    justify-content: center;
}
.flower-wrapper{
    position:absolute;
    bottom: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform-origin: bottom center;
    animation: grow-up 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.15) forwards, wind-sway 4s ease-in-out infinite alternate 1.2s ; 
    opacity: 0;
    
    
}
.f-left{
    left: 30px;
    transform: rotate(-20deg);
    animation-delay: 0.2s;
}
.f-center {
    z-index: 3;
    bottom: 140px;
    animation-delay: 0.5s;
}
.f-right {
    right: 30px;
    transform: rotate(20deg);
    animation-delay: 0.4s;
}
.stem {
    width: 6px;
    height: 160px;
    border-radius: 3px;
    background-color: #4caf50;
    z-index: 1;
}
.blossom {
    position: relative;
    width: 80px;
    height: 80px;
    margin-bottom: -10px;
}
.b-center{
    position: absolute;
    top: 27px;
    left: 27px;
    width: 26px;
    height: 26px;
    background-color: #ffeb3b;
    border-radius: 50%;
    z-index: 5;

}
.b-center.yellow {background-color: #ffa000;}
.b-petal {
    position:absolute;
    width: 36px;
    height: 36px;
    background-color: #ff80ab;
    border-radius: 50%;
    z-index: 5;
}
.bp1 {top: 0; left: 22px;}
.bp2 {bottom: 0;left: 22px;}
.bp3 {top: 22px;left: 0;}
.bp4 {top: 22px;right: 0;}
.purple .b-petal { background-color: #b388ff;}

.tulip{
    position: relative;
    width: 70px;
    height: 80px;
    margin-bottom: -5px;
}
.t-petal{
    position: absolute;
    bottom: 0;
    width: 45px;
    height: 80px;
}
.tp-back {
    background-color: #c2185b;
    left: 12px;
    border-radius: 50% 50% 30% 30%;
}
.tp-left{
    background-color: #e91e63;
    left: 0;
    border-radius: 70% 30% 50% 30%;
    transform: rotate(-10deg);
}
.tp--right{
    background-color: #ff5252;
    right: 0;
    border-radius: 30% 70% 30% 50%;
    transform: rotate(10deg);
}

.wrap-paper{
    position: absolute;
    bottom: 40px;
    width: 240px;
    height: 200px;
    background-color: rgba(245, 222, 179, 0.85);
    clip-path: polygon(0% 0%,100% 20%, 75% 100%, 25% 100%);
    z-index: 10;
    border-radius: 0 0 20px 20px;
    box-shadow: inset 0 20px 20px rgba(0,0,0,0.05);

}
.ribbon-bow{
    position: absolute;
    bottom: 65px;
    width: 35px;
    height: 20px;
    background-color: #d32f2f;
    border-radius: 10px;
    z-index: 12;
    box-shadow: 0 3px 6px rgba(0,0,0,0.15);
}
.ribbon-tail.left{
    position: absolute;
    bottom: 30px;
    left: 130px;
    width: 10px;
    height: 45px;
    background-color: #b71c1c;
    transform: rotate(15deg);
    z-index: 11;
    clip-path: polygon(0 0, 100% 0,100% 100%, 50% 85%,0 100%);
}
.ribbon-tail.right{
    position: absolute;
    bottom: 30px;
    right: 130px;
    width: 10px;
    height: 45px;
    background-color: #b71c1c;
    transform: rotate(-15deg);
    z-index: 11;
    clip-path: polygon(0 0, 100% 0,100% 100%, 50% 85%,0 100%);
}

@keyframes grow-up{
    0% {
        transform: scale(0) rotate(0deg);
        opacity: 0;
    }
    100% {
        transform: scale(1) rotate(inherit);
        opacity: 1;
    }
}
.bouquet:hover .flower-wrapper {
    margin-bottom: 8px;
    transition: margin 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes wind-sway{
    0% {transform:  rotate(0deg) translate(0, 0);  
    }
    50%{ transform: translate(4px, -1px) rotate(1.5deg);
    }
    100%{ transform: translate(4px, 1px) rotate(-1.5deg);
    }
    
}

.gift-card {
  position: absolute;
  bottom: 10px;
  width: 90px;
  background-color: #fff9e6;
  padding: 6px 10px;
  border-radius: 4px;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  border-left: 3px solid #d32f2f;
  font-family: 'Georgia', serif;
  font-size: 11px;
  font-style: italic;
  font-weight: bold;
  color: #5d4037;
  text-align: center;
  z-index: 16;
  transform: rotate(-8deg);
  transform-origin: top center;
  animation: wind-sway 4s ease-in-out infinite alternate 1.2s;
}
    </style>
</head>
<body>
<div class="bouquet">
    
    <div class="flower-wrapper f-left">
      <div class="blossom">
        <div class="b-center"></div>
        <div class="b-petal bp1"></div>
        <div class="b-petal bp2"></div>
        <div class="b-petal bp3"></div>
        <div class="b-petal bp4"></div>
      </div>
      <div class="stem"></div>
    </div>

    <div class="flower-wrapper f-right">
      <div class="blossom purple">
        <div class="b-center yellow"></div>
        <div class="b-petal bp1"></div>
        <div class="b-petal bp2"></div>
        <div class="b-petal bp3"></div>
        <div class="b-petal bp4"></div>
      </div>
      <div class="stem"></div>
    </div>

    <div class="flower-wrapper f-center">
      <div class="tulip">
        <div class="t-petal tp-back"></div>
        <div class="t-petal tp-left"></div>
        <div class="t-petal tp-right"></div>
      </div>
      <div class="stem"></div>
    </div>

    <div class="wrap-paper"></div>
    <div class="ribbon-bow"></div>
    <div class="ribbon-tail left"></div>
    <div class="ribbon-tail right"></div>

    <div class="gift-card"> flowers <br> for you</div>

  </div>

</body>
</html>
